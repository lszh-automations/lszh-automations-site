name: LSZH staging image lock and supply-chain preflight (no deployment)
on:
  push:
    branches:
      - feature/firestore-staging-dryrun-20261015
    paths:
      - '.github/workflows/lszh-staging-image-harden.yml'
      - 'services/offer-acceptance-staging/package.json'
      - 'services/offer-acceptance-staging/package-lock.json'
      - 'services/offer-acceptance-staging/Dockerfile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-lock-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact Firestore SDK and transitive deps for reviewed lockfile
        working-directory: services/offer-acceptance-staging
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json'));if(p.packages[''].dependencies['@google-cloud/firestore']!=='9.3.1')process.exit(1);if(!p.packages['node_modules/@google-cloud/firestore'].integrity)process.exit(1);console.log('resolved packages:',Object.keys(p.packages).length,'firestore version:',p.packages['node_modules/@google-cloud/firestore'].version)"
          node -e "const fs=require('fs');console.log('LSZH_LOCK_B64_BEGIN');console.log(fs.readFileSync('package-lock.json').toString('base64'));console.log('LSZH_LOCK_B64_END')"
      - name: Independently inspect official Node base-image index digest
        run: |
          docker buildx imagetools inspect node:22.23.3-bookworm-slim | head -45
      - name: Verify checked-in dependency lock is current and integrity-checked
        working-directory: services/offer-acceptance-staging
        run: |
          test -f package-lock.json
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json'));if(p.packages[''].dependencies['@google-cloud/firestore']!=='9.3.1')process.exit(1);if(p.packages['node_modules/@google-cloud/firestore'].version!=='9.3.1')process.exit(1);for(const [k,v] of Object.entries(p.packages)) if(k&&v.resolved&&!v.integrity) process.exit(1)"
      - name: Build exactly the isolated nonroot container image
        run: |
          docker build --pull --no-cache --file services/offer-acceptance-staging/Dockerfile --tag lszh-staging-read:ci .
          test "$(docker image inspect lszh-staging-read:ci --format '{{.Config.User}}')" = "node"
      - name: Verify no external-service connection and blocked acceptance in container
        run: |
          docker run --rm --detach --name lszh-readonly-ci --read-only \
            --tmpfs /tmp:rw,nosuid,noexec,size=8m \
            --cap-drop ALL --security-opt no-new-privileges \
            --publish 127.0.0.1:18080:8080 lszh-staging-read:ci
          trap 'docker rm -f lszh-readonly-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/healthz >/tmp/lszh-health.json; then break; fi
            sleep 1
          done
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/lszh-health.json'));if(j.acceptanceEnabled!==false||j.mode!=='staging')process.exit(1)"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/__internal/staging/firestore-read)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:18080/api/offer/accept)" = "503"
      - name: Scan built image for HIGH/CRITICAL OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 verified release
        with:
          scan-type: image
          image-ref: lszh-staging-read:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          ignore-unfixed: false
      - name: Audit runtime dependencies for published high/critical advisories
        working-directory: services/offer-acceptance-staging
        run: npm audit --omit=dev --audit-level=moderate
      # Never deploys/updates IAM, Cloud Run, Firestore, Drive or Airtable.
