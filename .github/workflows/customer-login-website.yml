name: Customer login website checks
on:
  pull_request:
  push:
    branches: [main, feature/customer-login-website-20261028]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.js
      - run: node --test scripts/test-customer-login-website.cjs
