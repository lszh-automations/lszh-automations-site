name: CRM V2 Cloud Staging Tests
on:
  push:
    branches:
      - feature/crm-v2-cloud-staging-20261023
  pull_request:
    paths:
      - 'crm-v2/**'
      - 'scripts/deploy-crm-cloud-staging.ps1'
      - '.github/workflows/crm-v2-cloud-staging.yml'
permissions:
  contents: read
jobs:
  crm-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check cloud-records.js
          node --check offer-pricing.js
          node --check invoice-pricing.js
          node --check project-tasks.js
          node --check mail-templates.js
          node --check mail-dispatcher.js
      - name: Validate PowerShell cutover scripts (no cloud commands executed)
        shell: pwsh
        run: |
          $scripts = @('../scripts/deploy-crm-cloud-staging.ps1', '../scripts/test-crm-website-intake-staging.ps1', '../scripts/preflight-crm-production.ps1', '../scripts/inventory-crm-firestore-readonly.ps1', '../scripts/prepare-crm-live-candidate.ps1', '../scripts/check-crm-live-candidate-http.ps1', '../scripts/cutover-crm-v2-live.ps1', '../scripts/deploy-crm-lead-refresh-live.ps1', '../scripts/learn-crm-mail-webhook.ps1', '../scripts/test-crm-business-mail.ps1', '../scripts/prepare-crm-mail-live.ps1', '../scripts/cutover-crm-mail-safe.ps1', '../scripts/activate-crm-mail-live.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parser failed for $script : $($parseErrors[0].Message)" }
          }
      - name: Run all CRM regression tests
        run: node --test
