name: MVP Lead Intake Tests
on:
  push:
    branches:
      - feature/mvp-website-intake-safety-20261014
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: npm test
