name: Firestore staging dry-run checks
on:
  pull_request:
    paths:
      - 'scripts/prepare-firestore-staging.js'
      - 'test/firestoreStagingDryrun.test.js'
      - 'firestoreAcceptanceState.js'
      - 'test/firestoreAcceptanceState.test.js'
      - 'stagingOfferSchema.js'
      - 'test/stagingOfferSchema.test.js'
      - 'stagingFirestoreConnection.js'
      - 'test/stagingFirestoreConnection.test.js'
      - '.github/workflows/firestore-staging-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    env:
      OFFER_ACCEPTANCE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check scripts/prepare-firestore-staging.js
          node --check test/firestoreStagingDryrun.test.js
          node --check firestoreAcceptanceState.js
          node --check test/firestoreAcceptanceState.test.js
          node --check stagingOfferSchema.js
          node --check test/stagingOfferSchema.test.js
          node --check stagingFirestoreConnection.js
          node --check test/stagingFirestoreConnection.test.js
      - name: Run offline tests only
        run: |
          node --test test/firestoreStagingDryrun.test.js test/firestoreAcceptanceState.test.js test/stagingOfferSchema.test.js test/stagingFirestoreConnection.test.js
          # No gcloud authentication, Firebase credentials, cloud writes or deploys.
